# Nginx reverse proxy for Ankurit.
# 1) Replace yourdomain.com below.  2) Copy to /etc/nginx/sites-available/ankurit
# 3) ln -s it into sites-enabled, then: nginx -t && systemctl reload nginx
# 4) Run certbot --nginx -d yourdomain.com -d www.yourdomain.com for free HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 15m;          # photo uploads for Leaf Doctor / Insect ID

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;           # keeps AI answers streaming word by word
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
